<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog - Uzum Market</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="chiziq">
        <nav class="nav-container">
            <!-- UZUM MARKET LOGOSIGA BOSGANDA BOSH SAHifAGA QAYTADI VA QO'L ISHORASI CHIQADI -->
            <div class="logo">
                <a href="index.html" style="text-decoration: none; display: flex; align-items: center; gap: 12px; cursor: pointer;">
                    <img src="img/uzumlogo.png" alt="Logo">
                    <span class="uzum">Uzum<br>Market</span>
                </a>
            </div>

            <!-- KATALOG TUGMASI O'Z NOMI BILAN QOLADI -->
            <button class="katalog-btn">
                <span>Katalog</span> 
            </button>

            <div class="search-box">
                <input name="qidiruv" id="search" placeholder="Mahsulotlarni qidirish...">
            </div>

            <div class="nav-icons">
                <a href="login.html" class="icon-item">
                    <img src="img/kirish.png" alt="Kirish">
                    <span class="hover">Kirish</span>
                </a>
                <div class="icon-item">
                    <img src="img/saralanganlar.png" alt="Saralanganlar">
                    <span class="hover">Saralanganlar</span>
                </div>
                <div class="icon-item">
                    <img src="img/savat.png" alt="Savat">
                    <span class="hover">Savat</span>
                </div>
            </div>
        </nav>
    </header>

    <!-- KATALOG RO'YXATI -->
    <main class="katalog-content">
        <h2>Barcha kategoriyalar</h2>
        <div class="katalog-grid">
            <a href="#" class="cat-card">📱 Elektronika</a>
            <a href="#" class="cat-card">🏠 Maishiy texnika</a>
            <a href="#" class="cat-card">👕 Kiyim-kechak</a>
            <a href="#" class="cat-card">👟 Poyabzallar</a>
            <a href="#" class="cat-card">✨ Go'zallik va parvarish</a>
            <a href="#" class="cat-card">⚽ Sport va hordiq</a>
            <a href="#" class="cat-card">📚 Kitoblar</a>
            <a href="#" class="cat-card">🧸 Bolalar tovarlari</a>
        </div>
    </main>
</body>
</html>
